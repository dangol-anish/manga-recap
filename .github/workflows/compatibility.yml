name: macOS and Windows compatibility
on: [push, pull_request, workflow_dispatch]
jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
          - os: macos-latest
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install CPU PyTorch on Windows
        if: runner.os == 'Windows'
        run: >-
          python -m pip install --only-binary=:all: torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: >-
          python -m pip install --only-binary=:all: -r requirements.lock.txt
      - run: python -m pip check
      - name: Install verified model helper source only (no weights or inference)
        run: python -m scripts.install_model --source-only
      - run: python -m scripts.doctor --media
      - run: python -m unittest discover -s tests -q
      - name: JavaScript control tests
        shell: pwsh
        run: |
          Get-ChildItem tests/test_*.cjs | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
