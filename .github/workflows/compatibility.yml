name: macOS and Windows compatibility
on: [push, pull_request, workflow_dispatch]
jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
          - os: macos-latest
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install CPU PyTorch on Windows
        if: runner.os == 'Windows'
        run: >-
          python -m pip install --only-binary=:all: torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: >-
          python -m pip install --only-binary=:all: -r requirements.lock.txt
      - run: python -m pip check
      - name: Install verified model helper source only (no weights or inference)
        run: python -m scripts.install_model --source-only
      - run: python -m scripts.doctor --media
      - name: Python and JavaScript regression tests
        run: python -m scripts.run_tests
      - name: Install development browser checks
        run: python -m pip install -r requirements-ui.txt
      - name: Install test browsers
        run: python -m playwright install chromium firefox
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ui-browsers
      - name: Install WebKit on macOS
        if: runner.os == 'macOS'
        run: python -m playwright install webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ui-browsers
      - name: Check Windows browser controls and layout
        if: runner.os == 'Windows'
        run: python -m scripts.check_ui --browsers chromium firefox --screenshots
      - name: Check macOS browser controls and layout
        if: runner.os == 'macOS'
        run: python -m scripts.check_ui --browsers chromium firefox webkit --screenshots
      - name: Save isolated UI reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-layout-${{ matrix.os }}
          path: reports/ui/
          if-no-files-found: ignore
          retention-days: 7
